name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & UI tests
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for rt in sorted(d, reverse=True) if "iOS" in rt for dev in d[rt] if dev["name"].startswith("iPhone")))')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project abb_campus.xcodeproj \
            -scheme abb_campus \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            | tee xcodebuild.log \
            | grep -E "Test (case|Case|Suite)|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild.log
